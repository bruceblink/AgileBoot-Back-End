# 开发环境配置（本地直启）
# 目标：不依赖 Docker 容器名，默认连接本机 MySQL / Redis，开箱即可本地调试。

keystone:
  file-base-dir: ${KEYSTONE_FILE_BASE_DIR:D:/keystone-dev}
  # 开发环境默认提供一把 2048-bit 示例 RSA 私钥，便于本地联调登录。
  # 如需更换，可执行：python scripts/secret_tool.py generate-rsa --bits 2048
  rsaPrivateKey: ${KEYSTONE_RSA_PRIVATE_KEY:}
  auth:
    # 本地开发默认对接 Keylo；如需本地账号密码登录，可设置 KEYSTONE_AUTH_MODE=local 且 KEYSTONE_AUTH_KEYLO_ENABLED=false。
    mode: ${KEYSTONE_AUTH_MODE:local}
    keylo:
      enabled: ${KEYSTONE_AUTH_KEYLO_ENABLED:false}
      base-url: ${KEYLO_BASE_URL:http://localhost:2345}
      issuer-uri: ${KEYLO_ISSUER_URI:http://localhost:2345}
      trusted-issuers: ${KEYLO_TRUSTED_ISSUERS:keylo}
      jwk-set-uri: ${KEYLO_JWK_SET_URI:http://localhost:2345/.well-known/jwks.json}
      audiences: ${KEYLO_AUDIENCES:admin-backend,sys_test}
      provisioning:
        enabled: ${KEYLO_PROVISIONING_ENABLED:false}
        admin-client-secret: cli-admin-root#312
  datasource:
    password-encryption:
      encrypt-key: ${KEYSTONE_DATASOURCE_ENCRYPT_KEY:}
      encrypt-key-file: ${KEYSTONE_DATASOURCE_ENCRYPT_KEY_FILE:docker/.secrets/.database_password.key}
  redis:
    password-encryption:
      encrypt-key: ${KEYSTONE_REDIS_ENCRYPT_KEY:}
      encrypt-key-file: ${KEYSTONE_REDIS_ENCRYPT_KEY_FILE:docker/.secrets/.redis_password.key}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    dynamic:
      datasource:
        master:
          url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33066/keystone?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
          username: ${SPRING_DATASOURCE_USERNAME:root}
          password-file: ${SPRING_DATASOURCE_PASSWORD_FILE:docker/.secrets/.database_password.enc}

  flyway:
    # 开发环境显式覆盖 basic 中的 Flyway 配置，避免本地启动时自动迁移。
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    locations:
      - classpath:db/migrate/common
      - classpath:db/migrate/mysql

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:keystone}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password-file: ${SPRING_DATA_REDIS_PASSWORD_FILE:docker/.secrets/.redis_password.enc}

logging:
  level:
    app.keystone: debug
  file:
    path: ${LOG_PATH:D:/logs/keystone-dev}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    # 生产环境默认关闭 Swagger UI。显式开启后仍需要 Keystone 登录认证。
    enabled: ${SPRINGDOC_ENABLED:true}
