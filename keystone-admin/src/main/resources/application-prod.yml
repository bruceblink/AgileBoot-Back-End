# 生产环境配置（MySQL + Redis）
# 公共基础配置在 application-basic.yml 中；敏感值优先通过环境变量注入。

keystone:
  file-base-dir: /app/data
  auth:
    mode: mixed
    keylo:
      enabled: true
      base-url: http://10.17.17.7:2345
  datasource:
    password-encryption:
      encrypt-key-file: ${KEYSTONE_DATASOURCE_ENCRYPT_KEY_FILE:/run/secrets/.database_password.key}
  redis:
    password-encryption:
      encrypt-key-file: ${KEYSTONE_REDIS_ENCRYPT_KEY_FILE:/run/secrets/.redis_password.key}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    dynamic:
      datasource:
        master:
          password-file: ${SPRING_DATASOURCE_PASSWORD_FILE:/run/secrets/.database_password.enc}
  data:
    redis:
      password-file: ${SPRING_DATA_REDIS_PASSWORD_FILE:/run/secrets/.redis_password.enc}

logging:
  level:
    root: info
    app.keystone: info
  file:
    path: /app/logs

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    # 生产环境默认关闭 Swagger UI
    enabled: ${SPRINGDOC_ENABLED:false}
