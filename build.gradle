plugins {
    id 'org.springframework.boot' version '3.5.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.spotbugs' version '6.0.27' apply false
}

allprojects {
    group = 'app.keystone'
    version = '3.6.1'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.aliyun.com/repository/spring'
            content {
                includeGroupByRegex 'org\\.springframework(\\..*)?'
                includeGroup 'org.springframework.boot'
                includeGroupByRegex 'io\\.spring(\\..*)?'
            }
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.13'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters', '-Xlint:deprecation', '-Xlint:unchecked'])
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = true
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    // Report-only: keep style findings visible without blocking builds.
    tasks.named('checkstyleMain') {
        ignoreFailures = true
    }

    // Report-only: keep test style findings visible without blocking builds.
    tasks.named('checkstyleTest') {
        ignoreFailures = true
    }

    spotbugs {
        toolVersion = '4.9.8'
        ignoreFailures = true
        showProgress = true
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    // Phase C step 3: make production bug findings fail the build.
    tasks.named('spotbugsMain') {
        ignoreFailures = true
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        if (name.toLowerCase().contains('test')) {
            auxClassPaths.from(sourceSets.test.compileClasspath)
            auxClassPaths.from(sourceSets.test.runtimeClasspath)
        } else {
            auxClassPaths.from(sourceSets.main.compileClasspath)
            auxClassPaths.from(sourceSets.main.runtimeClasspath)
        }
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        def baseArgs = [
            '-Xshare:off',
            '-Dnet.bytebuddy.experimental=true',
            '-Dspring.classformat.ignore=true',
            '-Djdk.net.URLClassPath.disableClassPathURLCheck=true',
            // 抑制 Netty 在测试 JVM 中的 sun.misc.Unsafe::allocateMemory 警告
            '-Dio.netty.tryReflectionSetAccessible=false',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED'
        ]
        // --sun-misc-unsafe-memory-access=allow 仅 JDK 23+ 支持，低版本（17/21）不识别该选项
        if (JavaVersion.current() >= JavaVersion.VERSION_23) {
            baseArgs += '--sun-misc-unsafe-memory-access=allow'
        }
        jvmArgs(baseArgs)
        maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
    }

    sourceSets {
        test {
            java {
                // H2-backed Spring integration tests are excluded from the default release gate.
                exclude 'app/keystone/integrationTest/**'
                exclude 'app/keystone/admin/config/SwaggerDisabledIntegrationTest.java'
            }
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn(tasks.named('test'))
        reports {
            xml.required = true
            csv.required = false
            html.required = true
        }
    }

    tasks.named('check') {
        dependsOn(tasks.named('jacocoTestReport'))
        dependsOn(tasks.named('checkstyleMain'))
        dependsOn(tasks.named('checkstyleTest'))
        dependsOn(tasks.named('spotbugsMain'))
        dependsOn(tasks.named('spotbugsTest'))
    }

    // 对应父 POM <dependencies>：所有子模块继承
    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'
        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
        compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        if (project.name != 'keystone-framework-spring-boot-starter') {
            api 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'
        }
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

def frameworkPublicationDescriptions = [
    'keystone-common': 'Keystone framework common utilities, DTOs, enums, and shared configuration',
    'keystone-infrastructure': 'Keystone framework infrastructure, security, cache, MyBatis, and web configuration',
    'keystone-framework-domain': 'Keystone framework domain services and system domain model',
    'keystone-framework-admin': 'Keystone framework admin web layer and security integration',
    'keystone-framework-spring-boot-starter': 'Spring Boot starter that aggregates Keystone framework modules'
]

configure([
    project(':keystone-common'),
    project(':keystone-infrastructure'),
    project(':keystone-framework-domain'),
    project(':keystone-framework-admin'),
    project(':keystone-framework-spring-boot-starter')
]) {
    def publicationName = project.name
    def publicationDescription = frameworkPublicationDescriptions[publicationName]

    apply plugin: 'maven-publish'

    dependencyManagement {
        generatedPomCustomization {
            enabled = false
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                pom {
                    name = publicationName
                    description = publicationDescription
                    url = 'https://github.com/bruceblink/Keystone'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                }
            }
        }
    }
}
